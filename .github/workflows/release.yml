name: Release

on:
  push:
    tags:
      - 'v*'

# Same-tag runs share this group, so a re-run waits instead of publishing twice.
# The npm and image jobs also join release-version-channel. Prepare and verify
# stay out of that group, so a re-run of an older tag does not block a newer
# tag from testing, and the two tags still cannot publish at the same time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Verify tag and version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      # The tag is read here, and the commit it names is resolved and verified
      # below. No other job checks out the tag itself.
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Resolve the tagged commit and check the version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          # The tag is a mutable ref: anyone can move it while this workflow is
          # queued or running. Resolve it to the commit it names here, once, and
          # check out that commit in every later job, so the tarball and the
          # provenance attestation always describe the same commit.
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          fi
          if ! sha="$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}")"; then
            echo "::error::Could not resolve tag '$tag' to a commit."
            exit 1
          fi
          # The release event names the commit the tag pointed at when it was
          # pushed. A tag that moved before this job started is not this release.
          event_sha="$(git rev-parse --verify --quiet "${GITHUB_SHA}^{commit}" || printf '%s' "$GITHUB_SHA")"
          if [ "$sha" != "$event_sha" ]; then
            echo "::error::Tag '$tag' points at $sha, but this release was started for $event_sha. The tag was moved. Push a new tag instead of moving this one."
            exit 1
          fi
          # The version check reads the package.json of the commit the tag
          # names, so it checks what the release actually contains.
          pkg_version="$(git show "${sha}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          version="$(node scripts/bump-version.mjs --check-release-version "$tag" "$pkg_version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing $version from $tag at $sha"

  verify:
    name: Test and pack
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      name: ${{ steps.pack.outputs.name }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          GOOGLE_CLOUD_PROJECT: test-gcp-project
          GOOGLE_CLOUD_LOCATION: global

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --json --pack-destination "$RUNNER_TEMP/npm-package" > "$RUNNER_TEMP/npm-pack.json"
          report="$RUNNER_TEMP/npm-pack.json"
          name="$(node -p "require(process.argv[1])[0].name" "$report")"
          tarball="$(node -p "require(process.argv[1])[0].filename" "$report")"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "packed $tarball"

      - name: Verify npm package contents
        run: node scripts/check-package-contents.mjs "$RUNNER_TEMP/npm-pack.json"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  # This job holds id-token: write, so it runs no repository code and no
  # dependency scripts. It checks out the tagged commit only so npm can build
  # the provenance attestation, then publishes the tarball that `verify` checked.
  publish-npm:
    name: Publish to npm
    needs:
      - prepare
      - verify
    # Shared with the image job. cancel-in-progress stays false so a newer tag
    # does not abort a publish that has started, and queue max keeps every
    # waiting publish instead of dropping one when a third tag arrives.
    concurrency:
      group: release-version-channel
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # npm builds the provenance attestation from the source repository, so the
      # publishing job needs a git checkout of the released commit even though
      # it runs nothing from the repository: there is no install, build or test
      # step here, and the job token is not persisted into .git/config.
      - name: Checkout the released commit for provenance
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          # The tarball is downloaded outside the checkout, so the working tree stays clean.
          path: ${{ runner.temp }}/npm-package

      # The tag is a mutable ref, so it can be moved while this workflow runs.
      # Every job checked out the commit the tag named when the release started,
      # so a moved tag means the published version would name a commit this
      # release did not build. The release stops instead of publishing it.
      - name: Verify the tag still names the released commit
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.prepare.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          if ! remote="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"; then
            echo "::error::Could not read tag '$TAG' from origin."
            exit 1
          fi
          # An annotated tag lists the tag object and the commit it points at.
          # A lightweight tag only lists the commit.
          current="$(printf '%s\n' "$remote" | awk -v ref="refs/tags/$TAG" '$2 == ref "^{}" {print $1}')"
          if [ -z "$current" ]; then
            current="$(printf '%s\n' "$remote" | awk -v ref="refs/tags/$TAG" '$2 == ref {print $1}')"
          fi
          if [ -z "$current" ]; then
            echo "::error::Tag '$TAG' is not on origin."
            exit 1
          fi
          if [ "$current" != "$SHA" ]; then
            echo "::error::Tag '$TAG' now points at $current, but this release was built from $SHA. The tag was moved while the release was running. Push a new tag instead of moving this one."
            exit 1
          fi
          echo "Tag $TAG still points at $SHA"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NAME: ${{ needs.verify.outputs.name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARBALL: ${{ runner.temp }}/npm-package/${{ needs.verify.outputs.tarball }}
        run: |
          # npm can print a scalar value inside quotes, so a matching pair is stripped
          # before the value is compared with the version.
          unquote() {
            local value="$1"
            case "$value" in
              \'*\' | \"*\" | \`*\`) value="${value:1:${#value}-2}" ;;
            esac
            printf '%s' "$value"
          }
          if published="$(npm view "$NAME@$VERSION" version 2>"$RUNNER_TEMP/npm-view.err")"; then
            published="$(unquote "$published")"
            if [ "$published" = "$VERSION" ]; then
              echo "$NAME@$VERSION is already on the npm registry; skipping publish"
              exit 0
            fi
          elif ! grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
            cat "$RUNNER_TEMP/npm-view.err" >&2
            echo "::error::Could not check whether $NAME@$VERSION is on the npm registry."
            exit 1
          fi
          # npm moves the latest dist-tag on every publish. A release older than the
          # current latest goes out under the backport dist-tag so latest never moves back.
          if current="$(npm view "$NAME" dist-tags.latest 2>"$RUNNER_TEMP/npm-view.err")"; then
            current="$(unquote "$current")"
          elif grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
            current=""
          else
            cat "$RUNNER_TEMP/npm-view.err" >&2
            echo "::error::Could not read the npm latest dist-tag for $NAME."
            exit 1
          fi
          dist_tag=latest
          if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            dist_tag=backport
            echo "$VERSION is older than npm latest $current; publishing under the backport dist-tag"
          fi
          npm publish "$TARBALL" --access public --provenance --ignore-scripts --tag "$dist_tag"

  publish-image:
    name: Build and push GHCR image
    needs:
      - prepare
      - publish-npm
    # Shared with the npm job. The group is held for the whole job, including
    # the image build. The latest tag is chosen again after that build, so a
    # newer tag created while this job waits or builds is visible before
    # `latest` can move.
    concurrency:
      group: release-version-channel
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: adi-il/hq-jr
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # The tag is a mutable ref, so it can be moved while this workflow runs.
      # The image carries the release version, so a moved tag means the pushed
      # image would name a commit this release did not build.
      - name: Verify the tag still names the released commit
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.prepare.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          if ! remote="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"; then
            echo "::error::Could not read tag '$TAG' from origin."
            exit 1
          fi
          # An annotated tag lists the tag object and the commit it points at.
          # A lightweight tag only lists the commit.
          current="$(printf '%s\n' "$remote" | awk -v ref="refs/tags/$TAG" '$2 == ref "^{}" {print $1}')"
          if [ -z "$current" ]; then
            current="$(printf '%s\n' "$remote" | awk -v ref="refs/tags/$TAG" '$2 == ref {print $1}')"
          fi
          if [ -z "$current" ]; then
            echo "::error::Tag '$TAG' is not on origin."
            exit 1
          fi
          if [ "$current" != "$SHA" ]; then
            echo "::error::Tag '$TAG' now points at $current, but this release was built from $SHA. The tag was moved while the release was running. Push a new tag instead of moving this one."
            exit 1
          fi
          echo "Tag $TAG still points at $SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only the highest release tag moves `latest`. This runs after the
      # versioned image is pushed and immediately before `latest` is moved, so
      # the decision sees tags that arrived during the build.
      - name: Decide whether this release is the latest
        id: latest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -o pipefail
          tags="$(git ls-remote --tags --refs origin 'refs/tags/v*')"
          highest="$(printf '%s\n' "$tags" \
            | sed -n 's#^.*refs/tags/v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$#\1#p' \
            | sort -V | tail -n 1)"
          if [ -z "$highest" ]; then
            echo "::error::Could not list the release tags on origin."
            exit 1
          fi
          if [ "$highest" = "$VERSION" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION is the highest release tag; latest moves to it"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "$VERSION is older than $highest; latest stays where it is"
          fi

      - name: Move the latest tag
        if: steps.latest.outputs.latest == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$REGISTRY/$IMAGE_NAME:latest" \
            "$REGISTRY/$IMAGE_NAME:$VERSION"

  create-release:
    name: Create GitHub Release
    needs:
      - prepare
      - publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # The tag is a mutable ref, so it can be moved while this workflow runs.
      # The GitHub Release is attached to that tag, so a moved tag would publish
      # notes and a source archive for a commit this run did not build.
      - name: Verify the tag still names the released commit
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.prepare.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          if ! remote="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"; then
            echo "::error::Could not read tag '$TAG' from origin."
            exit 1
          fi
          # An annotated tag lists the tag object and the commit it points at.
          # A lightweight tag only lists the commit.
          current="$(printf '%s\n' "$remote" | awk -v ref="refs/tags/$TAG" '$2 == ref "^{}" {print $1}')"
          if [ -z "$current" ]; then
            current="$(printf '%s\n' "$remote" | awk -v ref="refs/tags/$TAG" '$2 == ref {print $1}')"
          fi
          if [ -z "$current" ]; then
            echo "::error::Tag '$TAG' is not on origin."
            exit 1
          fi
          if [ "$current" != "$SHA" ]; then
            echo "::error::Tag '$TAG' now points at $current, but this release was built from $SHA. The tag was moved while the release was running. Push a new tag instead of moving this one."
            exit 1
          fi
          echo "Tag $TAG still points at $SHA"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: hq-jr ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          body: |
            ## hq-jr ${{ needs.prepare.outputs.version }}

            ### Install
            ```bash
            npm install -g hq-jr@${{ needs.prepare.outputs.version }}
            ```

            ### Docker
            ```bash
            docker pull ghcr.io/adi-il/hq-jr:${{ needs.prepare.outputs.version }}
            ```
