name: Release

on:
  push:
    branches:
      - master
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Version, npm, GitHub Release, Docker
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: adi-il/hq-jr

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          GOOGLE_CLOUD_PROJECT: test-gcp-project
          GOOGLE_CLOUD_LOCATION: global

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: version
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if ! NPM_VERSION=$(npm view "$PKG_NAME" version 2>"$RUNNER_TEMP/npm-view.err"); then
            if ! grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
              cat "$RUNNER_TEMP/npm-view.err" >&2
              exit 1
            fi
            NPM_VERSION="$PKG_VERSION"
          fi
          NEXT_VERSION=$(node -e '
            const parse = (v) => {
              const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(v);
              if (!m) throw new Error("unsupported version " + JSON.stringify(v) + ", expected X.Y.Z");
              return m.slice(1).map(Number);
            };
            const [pkg, npm] = process.argv.slice(1).map(parse);
            const [major, minor, patch] = (pkg[0] - npm[0] || pkg[1] - npm[1] || pkg[2] - npm[2]) >= 0 ? pkg : npm;
            console.log([major, minor, patch + 1].join("."));
          ' "$PKG_VERSION" "$NPM_VERSION")
          echo "package.json ${PKG_VERSION}, npm latest ${NPM_VERSION} -> releasing ${NEXT_VERSION}"
          NEW_VERSION=$(npm version "$NEXT_VERSION" -m "chore: release %s [skip release]")
          NEW_VERSION="${NEW_VERSION#v}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${NEW_VERSION}"

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_ENV: production

      # Push after publish so a failed npm publish does not leave the repo/tag ahead of the registry.
      # The tag stays on the published commit. If merges landed during the run, only the branch
      # gets the version commit rebased on top, and Docker still builds from the tag.
      - name: Push version commit and tag
        env:
          BRANCH: ${{ github.ref_name }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git format-patch -1 --stdout > "$RUNNER_TEMP/release.patch" || true
          for attempt in 1 2 3 4; do
            if git push origin "refs/tags/$TAG"; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              RECOVERY_REF="refs/heads/release-recovery/$TAG"
              if git push origin "HEAD:$RECOVERY_REF"; then
                echo "::error::$TAG was published to npm but the tag push failed. The version commit is on $RECOVERY_REF and in artifact release-commit-$TAG; create $TAG from one of them. Do not republish."
              else
                echo "::error::$TAG was published to npm but the tag push failed. The version commit patch is in artifact release-commit-$TAG; create $TAG from it. Do not republish."
              fi
              exit 1
            fi
            sleep $((attempt * 5))
          done
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH" 2>"$RUNNER_TEMP/push.err"; then
              break
            fi
            cat "$RUNNER_TEMP/push.err" >&2
            if ! grep -Eq '\[rejected\].*\((fetch first|non-fast-forward)\)' "$RUNNER_TEMP/push.err"; then
              echo "::error::$BRANCH refused the $TAG version commit for a reason other than new commits. $TAG is published and tagged. Bump package.json on $BRANCH by hand."
              exit 1
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Could not push the $TAG version commit to $BRANCH after 5 attempts."
              exit 1
            fi
            sleep $((attempt * 5))
            git fetch origin "$BRANCH"
            if ! git rebase FETCH_HEAD; then
              git rebase --abort
              echo "::error::The $TAG version commit conflicts with $BRANCH. $TAG is published and tagged. Bump package.json on $BRANCH by hand."
              exit 1
            fi
          done
          git checkout -q "$TAG"

      - name: Save version commit patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-commit-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/release.patch
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and load image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push image tags to GHCR
        run: |
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: Save Docker image tarball for release asset
        run: |
          docker save "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}" \
            | gzip > "hq-jr-${{ steps.version.outputs.version }}-linux-amd64.tar.gz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            hq-jr-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
          body: |
            ## hq-jr v${{ steps.version.outputs.version }}

            ### Install
            ```bash
            npm install -g hq-jr@${{ steps.version.outputs.version }}
            ```

            ### Docker
            ```bash
            docker pull ghcr.io/adi-il/hq-jr:${{ steps.version.outputs.version }}
            ```

            Image also attached as `hq-jr-${{ steps.version.outputs.version }}-linux-amd64.tar.gz`.

