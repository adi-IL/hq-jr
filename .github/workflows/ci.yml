name: Continuous Integration

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog@v3.88.5
        with:
          # The action pins the scanner image separately. Left unset it pulls
          # latest, so the scanner would change under the pinned action.
          version: 3.88.5
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}
          # Skip the two fixture files. Unverified secrets everywhere else,
          # including private keys, still fail this step.
          extra_args: --exclude-paths=.github/trufflehog-fixture-paths.txt

      - name: TruffleHog verified scan of fixture paths
        uses: trufflesecurity/trufflehog@v3.88.5
        with:
          version: 3.88.5
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}
          # Scan only those fixture paths, and only secrets that verify.
          # The fake fixtures stay quiet. A live credential there fails the job.
          extra_args: --include-paths=.github/trufflehog-fixture-paths.txt --only-verified

  build-and-test:
    name: Typecheck, Test, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      GOOGLE_CLOUD_PROJECT: test-gcp-project
      GOOGLE_CLOUD_LOCATION: global
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Guard against committed ADC credentials
        run: |
          tracked="$(git ls-files -- gcloud | head -n 1)"
          if [ -n "$tracked" ]; then
            echo "::error::Files under gcloud/ are tracked by git: $tracked. The Application Default Credentials file must never be committed."
            exit 1
          fi
          if [ -d gcloud ] && [ -n "$(find gcloud -type f -name '*.json' -print -quit)" ]; then
            echo "::error::gcloud/ holds a credential JSON. The Application Default Credentials file must never be committed."
            exit 1
          fi
          echo "no credential file under gcloud/"

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Static Typecheck
        run: npm run typecheck

      - name: Execute Vitest Test Suites
        run: npm test

      - name: Production TypeScript Build
        run: npm run build

      - name: Verify CLI Binary Execution
        run: node ./dist/cli.js --help

      - name: Verify npm Package Contents
        run: node scripts/check-package-contents.mjs

      - name: Verify Documented Environment Variables
        run: node scripts/check-doc-drift.mjs

      - name: Verify Documentation Matches The Code
        run: node scripts/check-doc-code-sanity.mjs

      - name: Dependency Vulnerability Audit
        run: npm audit --omit=dev --audit-level=high
