name: Continuous Integration

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog@v3.88.5
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}
          # The two test files listed in the filter hold fake credential
          # fixtures. Exclude only those paths. The scan still reports
          # unverified secrets everywhere else, including private keys.
          extra_args: --exclude-paths=.github/trufflehog-exclude-paths.txt

  build-and-test:
    name: Typecheck, Test, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      GOOGLE_CLOUD_PROJECT: test-gcp-project
      GOOGLE_CLOUD_LOCATION: global
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Guard against committed ADC credentials
        run: |
          tracked="$(git ls-files -- gcloud | head -n 1)"
          if [ -n "$tracked" ]; then
            echo "::error::Files under gcloud/ are tracked by git: $tracked. The Application Default Credentials file must never be committed."
            exit 1
          fi
          if [ -d gcloud ] && [ -n "$(find gcloud -type f -name '*.json' -print -quit)" ]; then
            echo "::error::gcloud/ holds a credential JSON. The Application Default Credentials file must never be committed."
            exit 1
          fi
          echo "no credential file under gcloud/"

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Static Typecheck
        run: npm run typecheck

      - name: Execute Vitest Test Suites
        run: npm test

      - name: Production TypeScript Build
        run: npm run build

      - name: Verify CLI Binary Execution
        run: node ./dist/cli.js --help

      - name: Verify npm Package Contents
        run: node scripts/check-package-contents.mjs

      - name: Dependency Vulnerability Audit
        run: npm audit --omit=dev --audit-level=high
