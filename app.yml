name: hq-jr
url: https://github.com/adi-IL/hq-jr
hook_attributes:
  url: https://smee.io/your_smee_channel_id
description: Self-hosted GitHub App that reviews PRs with Vertex AI, remembers past findings, and can reproduce bugs in a sandbox before it speaks.
public: true
default_permissions:
  checks: write
  pull_requests: write
  contents: write
  issues: write
  metadata: read
default_events:
  - pull_request
  - pull_request_review_comment
  - issue_comment
  - check_run
