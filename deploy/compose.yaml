name: hq-jr

services:
  app:
    image: ghcr.io/adi-il/hq-jr:latest
    container_name: hq-jr
    restart: unless-stopped
    env_file:
      - /opt/hq-jr/.env
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
    volumes:
      - /opt/hq-jr/data:/app/data
      # This directory must contain only the ADC file and be readable by uid 1001.
      - /opt/hq-jr/gcloud:/gcloud:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/livez',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
