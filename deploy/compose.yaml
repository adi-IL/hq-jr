name: hq-jr

services:
  app:
    image: ghcr.io/adi-il/hq-jr:latest
    container_name: hq-jr
    restart: unless-stopped
    env_file:
      - /opt/hq-jr/.env
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
    volumes:
      - /opt/hq-jr/data:/app/data
      # Mount only the ADC JSON. Stage a copy readable by image uid 1001, for example:
      #   sudo install -o 1001 -g 1001 -m 0400 \
      #     /home/adi-IL/.config/gcloud/application_default_credentials.json \
      #     /opt/hq-jr/adc/application_default_credentials.json
      # On other hosts, replace the left-hand path. On GCE with a Vertex-scoped
      # service account, remove this mount and GOOGLE_APPLICATION_CREDENTIALS.
      - /opt/hq-jr/adc/application_default_credentials.json:/gcloud/application_default_credentials.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # /healthz calls Vertex AI (cached 60s). Timeout covers one slow call;
      # update.sh also uses AbortSignal.timeout(8000) on its probe.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz',{signal:AbortSignal.timeout(25000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
